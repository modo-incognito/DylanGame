<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Runner - Aimed Boss Edition</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  background: #5c94fc;
  box-shadow: 0 0 20px rgba(0,0,0,.5);
  max-width: 100%;
  max-height: 100%;
}

#touch-controls {
  position: absolute;
  bottom: 20px;
  left: 0;
  width: 100%;
  height: 130px;
  display: flex;
  justify-content: space-between;
  padding: 0 25px;
  pointer-events: none;
}

.btn-group {
  display: flex;
  gap: 12px;
  pointer-events: auto;
  align-items: center;
}

.touch-btn {
  width: 80px;
  height: 80px;
  background: rgba(255,255,255,.3);
  border: 3px solid rgba(255,255,255,.6);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
  color: white;
  touch-action: none;
}

.touch-btn:active {
  background: rgba(255,255,255,.6);
  transform: scale(.95);
}

#btn-jump {
  width: 100px;
  height: 100px;
  background: rgba(255,50,50,.4);
  font-size: 34px;
}

#btn-shoot {
  width: 90px;
  height: 90px;
  background: rgba(255,165,0,.5);
}

#btn-switch {
  width: 70px;
  height: 70px;
  background: rgba(155,89,182,.5);
  display: none;
}
</style>
</head>

<body>

<div id="game-container">

<canvas id="canvas" width="800" height="450"></canvas>

<div id="touch-controls">

  <div class="btn-group">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>

  <div class="btn-group">
    <div class="touch-btn" id="btn-switch">🔄</div>
    <div class="touch-btn" id="btn-shoot">🔥</div>
    <div class="touch-btn" id="btn-jump">▲</div>
  </div>

</div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const playerImage = new Image();
playerImage.src = "Dylan.png";

const GAME_WIDTH = 800;
const GAME_HEIGHT = 450;

const GRAVITY = 0.45;
const COYOTE_TIME = 120;
const JUMP_BUFFER_TIME = 120;

let coyoteTimer = 0;
let jumpBufferTimer = 0;

let gameOver = false;
let gameWon = false;
let score = 0;

let cameraX = 0;

const keys = {
  left: false,
  right: false,
  up: false,
  shoot: false,
  switch: false
};


/* =========================
   CONTROLES
   ========================= */

function setupTouchEvents() {

  function bindTouch(id, key) {

    const el = document.getElementById(id);

    el.addEventListener("pointerdown", function(e) {

      e.preventDefault();

      keys[key] = true;

      if (key === "shoot") {
        shootProjectile();
      }

      if (key === "switch") {
        switchPower();
      }

    });

    el.addEventListener("pointerup", function(e) {

      e.preventDefault();

      keys[key] = false;

    });

    el.addEventListener("pointercancel", function() {

      keys[key] = false;

    });

  }

  bindTouch("btn-left", "left");
  bindTouch("btn-right", "right");
  bindTouch("btn-jump", "up");
  bindTouch("btn-shoot", "shoot");
  bindTouch("btn-switch", "switch");
}

setupTouchEvents();


/* =========================
   TECLADO
   ========================= */

window.addEventListener("keydown", function(e) {

  if (e.key === "ArrowLeft" || e.key === "a") {
    keys.left = true;
  }

  if (e.key === "ArrowRight" || e.key === "d") {
    keys.right = true;
  }

  if (e.key === "ArrowUp" || e.key === " " || e.key === "w") {
    keys.up = true;
    e.preventDefault();
  }

  if (e.key === "x" || e.key === "j") {
    shootProjectile();
  }

  if (e.key === "c" || e.key === "k") {
    switchPower();
  }

});

window.addEventListener("keyup", function(e) {

  if (e.key === "ArrowLeft" || e.key === "a") {
    keys.left = false;
  }

  if (e.key === "ArrowRight" || e.key === "d") {
    keys.right = false;
  }

  if (e.key === "ArrowUp" || e.key === " " || e.key === "w") {
    keys.up = false;
  }

});


/* =========================
   JUGADOR
   ========================= */

const player = {

  x: 50,
  y: 300,

  width: 45,
  height: 60,

  vx: 0,
  vy: 0,

  baseSpeed: 4,
  jumpPower: -11,

  grounded: false,

  power: "none",
  powerTimer: 0,

  facingRight: true,

  slowTimer: 0,

  inBossArea: false,

  draw: function() {

    if (!playerImage.complete) return;

    ctx.save();

    if (!this.facingRight) {

      ctx.translate(
        this.x - cameraX + this.width,
        this.y
      );

      ctx.scale(-1, 1);

      ctx.drawImage(
        playerImage,
        0,
        0,
        this.width,
        this.height
      );

    } else {

      ctx.drawImage(
        playerImage,
        this.x - cameraX,
        this.y,
        this.width,
        this.height
      );

    }

    ctx.restore();

  }

};


/* =========================
   PLATAFORMAS
   ========================= */

const platforms = [

  {x:0,y:400,width:900,height:50},
  {x:980,y:400,width:800,height:50},
  {x:1800,y:400,width:700,height:50},
  {x:2500,y:400,width:800,height:50},

  {x:300,y:280,width:120,height:20},
  {x:500,y:200,width:100,height:20},
  {x:750,y:260,width:100,height:20},

  {x:1150,y:280,width:120,height:20},
  {x:1350,y:200,width:100,height:20},
  {x:1550,y:260,width:120,height:20},

  {x:1950,y:280,width:180,height:20},
  {x:2700,y:260,width:140,height:20}

];


/* =========================
   ITEMS
   ========================= */

const items = [

  {x:200,y:360,width:20,height:20,type:"fire",collected:false},
  {x:340,y:240,width:15,height:15,type:"coin",collected:false},
  {x:530,y:160,width:20,height:20,type:"ice",collected:false},
  {x:780,y:220,width:20,height:20,type:"fire",collected:false},

  {x:1180,y:240,width:20,height:20,type:"ice",collected:false},
  {x:1380,y:160,width:20,height:20,type:"fire",collected:false},
  {x:1580,y:220,width:20,height:20,type:"ice",collected:false},

  {x:2000,y:240,width:20,height:20,type:"fire",collected:false},
  {x:2120,y:240,width:20,height:20,type:"ice",collected:false}

];


/* =========================
   ENEMIGOS
   ========================= */

const enemies = [

  {
    x:400,
    y:370,
    width:30,
    height:30,
    vx:-1.5,
    vy:0,
    type:"goomba",
    alive:true
  },

  {
    x:1100,
    y:360,
    width:30,
    height:40,
    vx:0,
    vy:0,
    type:"fire_enemy",
    shootTimer:0,
    alive:true
  },

  {
    x:1400,
    y:360,
    width:30,
    height:40,
    vx:0,
    vy:0,
    type:"ice_enemy",
    shootTimer:0,
    alive:true
  },

  {
    x:1650,
    y:350,
    width:45,
    height:50,
    vx:1,
    vy:0,
    type:"stone_enemy",
    hp:84,
    maxHp:84,
    jumpTimer:0,
    alive:true,
    minX:1500,
    maxX:1780
  },

  {
    x:2050,
    y:350,
    width:45,
    height:50,
    vx:-1,
    vy:0,
    type:"stone_enemy",
    hp:84,
    maxHp:84,
    jumpTimer:0,
    alive:true,
    minX:1900,
    maxX:2300
  }

];


/* =========================
   JEFE
   ========================= */

const boss = {

  x:2900,
  y:280,

  width:70,
  height:120,

  hp:20,
  maxHp:20,

  vx:2,

  shootTimer:0,
  slowTimer:0,
  stateTimer:0,

  state:"base",

  alive:true,

  draw:function() {

    if (!this.alive) return;

    if (this.state === "base") {
      ctx.fillStyle = "#8e44ad";
    }

    if (this.state === "fire") {
      ctx.fillStyle = "#e74c3c";
    }

    if (this.state === "ice") {
      ctx.fillStyle = "#3498db";
    }

    ctx.fillRect(
      this.x-cameraX,
      this.y,
      this.width,
      this.height
    );

    ctx.fillStyle = "#fff";

    ctx.fillRect(
      this.x-cameraX+10,
      this.y+20,
      15,
      15
    );

    ctx.fillRect(
      this.x-cameraX+45,
      this.y+20,
      15,
      15
    );

    ctx.fillStyle = "#000";

    ctx.fillRect(
      this.x-cameraX,
      this.y-20,
      this.width,
      10
    );

    ctx.fillStyle = "#2ecc71";

    ctx.fillRect(
      this.x-cameraX,
      this.y-20,
      this.width*(this.hp/this.maxHp),
      10
    );

    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";

    let label = "JEFE: MODO BASE";

    if (this.state === "fire") {
      label = "JEFE: FUEGO - USA HIELO";
    }

    if (this.state === "ice") {
      label = "JEFE: HIELO - USA FUEGO";
    }

    ctx.fillText(
      label,
      this.x-cameraX+this.width/2,
      this.y-30
    );

  }

};


/* =========================
   PROYECTILES
   ========================= */

const playerProjectiles = [];
const enemyProjectiles = [];


function shootAimedEnemyProjectile(
  sourceX,
  sourceY,
  targetX,
  targetY,
  speed,
  type
) {

  const dx = targetX-sourceX;
  const dy = targetY-sourceY;

  const dist = Math.hypot(dx,dy) || 1;

  enemyProjectiles.push({

    x:sourceX,
    y:sourceY,

    width:12,
    height:12,

    vx:(dx/dist)*speed,
    vy:(dy/dist)*speed,

    type:type

  });

}


function shootProjectile() {

  if (player.power === "none") return;

  playerProjectiles.push({

    x:player.facingRight
      ? player.x+player.width
      : player.x-10,

    y:player.y+20,

    width:12,
    height:12,

    vx:player.facingRight ? 8 : -8,

    type:player.power

  });

}


function switchPower() {

  if (!player.inBossArea) return;

  player.power =
    player.power === "fire"
      ? "ice"
      : "fire";

  document.getElementById("btn-shoot").innerText =
    player.power === "fire"
      ? "🔥"
      : "❄️";

}


/* =========================
   COLISIÓN
   ========================= */

function checkCollision(a,b) {

  return (
    a.x < b.x+b.width &&
    a.x+a.width > b.x &&
    a.y < b.y+b.height &&
    a.y+a.height > b.y
  );

}


/* =========================
   UPDATE
   ========================= */

function update() {

  if (gameOver || gameWon) return;


  /* Movimiento */

  let speed = player.baseSpeed;

  if (player.slowTimer > 0) {
    player.slowTimer -= 16;
    speed *= .5;
  }

  if (keys.left) {

    player.vx -= .6;
    player.facingRight = false;

  }
  else if (keys.right) {

    player.vx += .6;
    player.facingRight = true;

  }
  else {

    player.vx *= .8;

  }

  player.vx = Math.max(
    -speed,
    Math.min(speed,player.vx)
  );

  player.x += player.vx;


  /* Zona jefe */

  if (player.inBossArea) {

    player.x = Math.max(
      2500,
      Math.min(3270,player.x)
    );

  }


  /* Salto */

  if (keys.up) {
    jumpBufferTimer = JUMP_BUFFER_TIME;
  }

  if (jumpBufferTimer > 0) {
    jumpBufferTimer -= 16;
  }

  if (player.grounded) {
    coyoteTimer = COYOTE_TIME;
  }
  else {
    coyoteTimer -= 16;
  }

  if (
    jumpBufferTimer > 0 &&
    coyoteTimer > 0
  ) {

    player.vy = player.jumpPower;
    player.grounded = false;

    jumpBufferTimer = 0;
    coyoteTimer = 0;

  }


  /* Gravedad */

  player.vy += GRAVITY;
  player.y += player.vy;

  player.grounded = false;


  /* Colisión plataformas */

  platforms.forEach(function(p) {

    if (checkCollision(player,p)) {

      if (player.vy > 0) {

        player.y = p.y-player.height;
        player.vy = 0;
        player.grounded = true;

      }
      else if (player.vy < 0) {

        player.y = p.y+p.height;
        player.vy = 0;

      }

    }

  });


  /* Caída */

  if (player.y > GAME_HEIGHT+100) {
    gameOver = true;
  }


  /* Poderes */

  items.forEach(function(item) {

    if (
      !item.collected &&
      checkCollision(player,item)
    ) {

      item.collected = true;

      if (item.type === "coin") {
        score += 100;
      }

      if (!player.inBossArea) {

        if (item.type === "fire") {

          player.power = "fire";
          player.powerTimer = 10000;

        }

        if (item.type === "ice") {

          player.power = "ice";
          player.powerTimer = 10000;

        }

        document.getElementById("btn-shoot").innerText =
          player.power === "fire" ? "🔥" : "❄️";

      }

    }

  });


  /* Entrar al jefe */

  if (
    player.x >= 2500 &&
    !player.inBossArea
  ) {

    player.inBossArea = true;
    player.power = "fire";

    document.getElementById(
      "btn-switch"
    ).style.display = "flex";

    document.getElementById(
      "btn-shoot"
    ).innerText = "🔥";

  }


  /* Cámara */

  if (player.inBossArea) {

    cameraX = 2500;

  }
  else {

    cameraX =
      player.x-GAME_WIDTH/3;

    cameraX = Math.max(0,cameraX);

  }


  /* Poder temporal */

  if (
    !player.inBossArea &&
    player.power !== "none"
  ) {

    player.powerTimer -= 16;

    if (player.powerTimer <= 0) {

      player.power = "none";

      document.getElementById(
        "btn-shoot"
      ).innerText = "🔥";

    }

  }


  /* =========================
     ENEMIGOS
     ========================= */

  enemies.forEach(function(e) {

    if (!e.alive) return;


    if (e.type === "goomba") {

      e.x += e.vx;

      if (e.x < 300 || e.x > 800) {
        e.vx *= -1;
      }

    }


    if (
      e.type === "fire_enemy" ||
      e.type === "ice_enemy"
    ) {

      e.shootTimer += 16;

      if (e.shootTimer >= 2500) {

        shootAimedEnemyProjectile(
          e.x,
          e.y+10,
          player.x+player.width/2,
          player.y+player.height/2,
          3.5,
          e.type === "fire_enemy"
            ? "fire"
            : "ice"
        );

        e.shootTimer = 0;

      }

    }


    if (e.type === "stone_enemy") {

      e.x += e.vx;

      if (
        e.x < e.minX ||
        e.x > e.maxX
      ) {
        e.vx *= -1;
      }

      e.jumpTimer += 16;

      if (e.jumpTimer >= 2000) {

        e.vy = -7.5;
        e.jumpTimer = 0;

      }

      e.vy += GRAVITY;
      e.y += e.vy;

      platforms.forEach(function(p) {

        if (checkCollision(e,p)) {

          if (e.vy > 0) {

            e.y = p.y-e.height;
            e.vy = 0;

          }

        }

      });

    }


    if (checkCollision(player,e)) {

      if (
        player.vy > 0 &&
        player.y+player.height-player.vy <= e.y+12
      ) {

        player.vy = -8;

        if (e.type === "stone_enemy") {

          e.hp -= 12;

          if (e.hp <= 0) {
            e.alive = false;
            score += 400;
          }

        }
        else {

          e.alive = false;
          score += 200;

        }

      }
      else {

        gameOver = true;

      }

    }

  });


  /* =========================
     PROYECTILES DEL JUGADOR
     ========================= */

  for (
    let i=playerProjectiles.length-1;
    i>=0;
    i--
  ) {

    const p = playerProjectiles[i];

    p.x += p.vx;

    let remove = false;


    enemies.forEach(function(e) {

      if (
        e.alive &&
        checkCollision(p,e)
      ) {

        if (
          e.type === "stone_enemy"
        ) {

          e.hp -= 20;

          if (e.hp <= 0) {
            e.alive = false;
            score += 400;
          }

        }
        else {

          e.alive = false;
          score += 200;

        }

        remove = true;

      }

    });


    if (
      boss.alive &&
      checkCollision(p,boss)
    ) {

      if (
        (p.type === "fire" && boss.state !== "fire") ||
        (p.type === "ice" && boss.state !== "ice")
      ) {

        boss.hp--;

        if (boss.hp <= 0) {

          boss.alive = false;
          gameWon = true;

        }

      }

      remove = true;

    }


    if (
      p.x < cameraX-100 ||
      p.x > cameraX+GAME_WIDTH+100
    ) {
      remove = true;
    }


    if (remove) {
      playerProjectiles.splice(i,1);
    }

  }


  /* =========================
     PROYECTILES ENEMIGOS
     ========================= */

  for (
    let i=enemyProjectiles.length-1;
    i>=0;
    i--
  ) {

    const p = enemyProjectiles[i];

    p.x += p.vx;
    p.y += p.vy;

    if (checkCollision(player,p)) {

      if (p.type === "ice") {
        player.slowTimer = 3000;
      }
      else {
        gameOver = true;
      }

      enemyProjectiles.splice(i,1);
      continue;

    }

    if (
      p.x < cameraX-200 ||
      p.x > cameraX+GAME_WIDTH+200 ||
      p.y < -200 ||
      p.y > GAME_HEIGHT+200
    ) {

      enemyProjectiles.splice(i,1);

    }

  }


  /* =========================
     JEFE
     ========================= */

  if (boss.alive) {

    let bossSpeed = boss.vx;

    if (boss.slowTimer > 0) {
      boss.slowTimer -= 16;
      bossSpeed *= .4;
    }

    boss.x += bossSpeed;

    if (
      boss.x < 2550 ||
      boss.x > 3200
    ) {
      boss.vx *= -1;
    }

    boss.stateTimer += 16;

    if (boss.stateTimer >= 5000) {

      const states = [
        "base",
        "fire",
        "ice"
      ];

      boss.state =
        states[
          Math.floor(
            Math.random()*states.length
          )
        ];

      boss.stateTimer = 0;

    }

    boss.shootTimer += 16;

    if (boss.shootTimer >= 1800) {

      shootAimedEnemyProjectile(
        boss.x+boss.width/2,
        boss.y+40,
        player.x+player.width/2,
        player.y+player.height/2,
        4.5,
        "boss"
      );

      boss.shootTimer = 0;

    }

    if (checkCollision(player,boss)) {
      gameOver = true;
    }

  }

}


/* =========================
   DIBUJAR
   ========================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  /* Fondo */

  ctx.fillStyle = "#5c94fc";

  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  /* Nubes */

  ctx.fillStyle = "rgba(255,255,255,.7)";

  for (let i=0;i<8;i++) {

    const x =
      (i*500-cameraX*.2)%4000;

    ctx.beginPath();

    ctx.arc(
      x,
      80+(i%3)*35,
      25,
      0,
      Math.PI*2
    );

    ctx.arc(
      x+30,
      80+(i%3)*35,
      35,
      0,
      Math.PI*2
    );

    ctx.arc(
      x+65,
      80+(i%3)*35,
      25,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* Plataformas */

  platforms.forEach(function(p) {

    ctx.fillStyle = "#8b4513";

    ctx.fillRect(
      p.x-cameraX,
      p.y,
      p.width,
      p.height
    );

    ctx.fillStyle = "#2ecc71";

    ctx.fillRect(
      p.x-cameraX,
      p.y,
      p.width,
      8
    );

  });


  /* Items */

  items.forEach(function(item) {

    if (item.collected) return;

    if (item.type === "fire") {
      ctx.fillStyle = "#ff6600";
    }

    if (item.type === "ice") {
      ctx.fillStyle = "#00ccff";
    }

    if (item.type === "coin") {
      ctx.fillStyle = "#ffd700";
    }

    ctx.beginPath();

    ctx.arc(
      item.x-cameraX+item.width/2,
      item.y+item.height/2,
      item.width/2,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  /* Enemigos */

  enemies.forEach(function(e) {

    if (!e.alive) return;

    if (e.type === "goomba") {
      ctx.fillStyle = "#8b4513";
    }
    else if (e.type === "fire_enemy") {
      ctx.fillStyle = "#e74c3c";
    }
    else if (e.type === "ice_enemy") {
      ctx.fillStyle = "#3498db";
    }
    else {
      ctx.fillStyle = "#555";
    }

    ctx.fillRect(
      e.x-cameraX,
      e.y,
      e.width,
      e.height
    );

  });


  /* Proyectiles jugador */

  playerProjectiles.forEach(function(p) {

    ctx.fillStyle =
      p.type === "fire"
        ? "#ff4500"
        : "#00ffff";

    ctx.beginPath();

    ctx.arc(
      p.x-cameraX,
      p.y,
      7,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  /* Proyectiles enemigos */

  enemyProjectiles.forEach(function(p) {

    ctx.fillStyle =
      p.type === "ice"
        ? "#00ffff"
        : "#ff2222";

    ctx.beginPath();

    ctx.arc(
      p.x-cameraX,
      p.y,
      7,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  /* Jefe */

  boss.draw();


  /* Jugador */

  player.draw();


  /* Interfaz */

  ctx.textAlign = "left";
  ctx.font = "bold 16px Arial";
  ctx.fillStyle = "#fff";

  ctx.fillText(
    "Puntos: "+score,
    20,
    30
  );


  if (
    !player.inBossArea &&
    player.power !== "none"
  ) {

    ctx.fillText(
      "Poder: "+
      player.power.toUpperCase()+
      " ("+
      Math.ceil(player.powerTimer/1000)+
      "s)",
      20,
      55
    );

  }

  if (player.inBossArea) {

    ctx.fillText(
      "Poder: "+
      player.power.toUpperCase()+
      " | 🔄 para cambiar",
      20,
      55
    );

  }


  /* Game Over */

  if (gameOver) {

    ctx.fillStyle = "rgba(0,0,0,.8)";

    ctx.fillRect(
      0,
      0,
      GAME_WIDTH,
      GAME_HEIGHT
    );

    ctx.fillStyle = "#ff4444";

    ctx.font = "bold 40px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
      "¡HAS PERDIDO!",
      GAME_WIDTH/2,
      GAME_HEIGHT/2
    );

    ctx.font = "20px Arial";

    ctx.fillStyle = "#fff";

    ctx.fillText(
      "Toca la pantalla para reiniciar",
      GAME_WIDTH/2,
      GAME_HEIGHT/2+50
    );

  }


  /* Victoria */

  if (gameWon) {

    ctx.fillStyle = "rgba(0,0,0,.8)";

    ctx.fillRect(
      0,
      0,
      GAME_WIDTH,
      GAME_HEIGHT
    );

    ctx.fillStyle = "#2ecc71";

    ctx.font = "bold 40px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
      "¡VICTORIA TOTAL!",
      GAME_WIDTH/2,
      GAME_HEIGHT/2
    );

    ctx.font = "20px Arial";

    ctx.fillStyle = "#fff";

    ctx.fillText(
      "Puntuación final: "+score,
      GAME_WIDTH/2,
      GAME_HEIGHT/2+50
    );

  }

}


/* =========================
   REINICIAR
   ========================= */

function resetGame() {

  gameOver = false;
  gameWon = false;

  score = 0;
  cameraX = 0;

  player.x = 50;
  player.y = 300;

  player.vx = 0;
  player.vy = 0;

  player.grounded = false;

  player.power = "none";
  player.powerTimer = 0;

  player.facingRight = true;

  player.slowTimer = 0;
  player.inBossArea = false;

  boss.x = 2900;
  boss.y = 280;
  boss.hp = boss.maxHp;
  boss.vx = 2;
  boss.shootTimer = 0;
  boss.slowTimer = 0;
  boss.stateTimer = 0;
  boss.state = "base";
  boss.alive = true;

  playerProjectiles.length = 0;
  enemyProjectiles.length = 0;

  items.forEach(function(item) {
    item.collected = false;
  });

  enemies[0].x = 400;
  enemies[0].vx = -1.5;
  enemies[0].alive = true;

  enemies[1].x = 1100;
  enemies[1].alive = true;
  enemies[1].shootTimer = 0;

  enemies[2].x = 1400;
  enemies[2].alive = true;
  enemies[2].shootTimer = 0;

  enemies[3].x = 1650;
  enemies[3].y = 350;
  enemies[3].vx = 1;
  enemies[3].vy = 0;
  enemies[3].hp = 84;
  enemies[3].jumpTimer = 0;
  enemies[3].alive = true;

  enemies[4].x = 2050;
  enemies[4].y = 350;
  enemies[4].vx = -1;
  enemies[4].vy = 0;
  enemies[4].hp = 84;
  enemies[4].jumpTimer = 0;
  enemies[4].alive = true;

  document.getElementById(
    "btn-switch"
  ).style.display = "none";

  document.getElementById(
    "btn-shoot"
  ).innerText = "🔥";

}


/* =========================
   REINICIAR AL TOCAR
   ========================= */

window.addEventListener(
  "pointerdown",
  function(e) {

    if (gameOver || gameWon) {

      if (
        e.target.classList &&
        e.target.classList.contains("touch-btn")
      ) {
        return;
      }

      resetGame();

    }

  }
);


/* =========================
   GAME LOOP
   ========================= */

function gameLoop() {

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>
